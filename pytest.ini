[pytest]
# Run from the repo root; `pythonpath` makes `config` / `src` importable without PYTHONPATH.
testpaths = tests
pythonpath = .

# -ra: summary of skips/failures; --strict-markers: a typo in a marker fails instead of silently selecting nothing.
addopts =
    -v -s
    -ra
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --css=config/report.css

markers =
    smoke: fast environment checks (driver starts, WAP layout)
    e2e: full user flow on m.twitch.tv

xfail_strict = true

# Live logs so a long browser flow shows progress while it runs.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-5s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
